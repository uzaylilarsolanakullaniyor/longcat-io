<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longcat.io</title>
<style>
  /* ===== GLOBAL RESET & FONTS ===== */
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  canvas {
    display: block;
    cursor: none;
  }

  /* ===== START SCREEN ===== */
  #startScreen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 40% 40%, #1a0a2e 0%, #0a0a1a 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 0;
  }

  #startScreen h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(3.5rem, 8vw, 6rem);
    color: #fff;
    text-shadow: 0 0 30px #ff6bff, 0 0 60px #ff6bff44;
    letter-spacing: 2px;
    animation: pulse 2.5s ease-in-out infinite;
    margin-bottom: 4px;
  }

  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 30px #ff6bff, 0 0 60px #ff6bff44; }
    50% { text-shadow: 0 0 50px #ff6bff, 0 0 100px #ff6bff88, 0 0 150px #ff6bff22; }
  }

  #startScreen .subtitle {
    font-size: 1.1rem;
    color: #a78bfa;
    margin-bottom: 40px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* Cat decoration on start screen */
  #startCat {
    font-size: 3rem;
    margin-bottom: 30px;
    animation: bounce 1.5s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  #nameInput {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,107,255,0.4);
    border-radius: 50px;
    padding: 14px 28px;
    font-size: 1.1rem;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    color: #fff;
    outline: none;
    width: 280px;
    text-align: center;
    margin-bottom: 18px;
    transition: border-color 0.3s, box-shadow 0.3s;
    letter-spacing: 1px;
  }

  #nameInput::placeholder { color: rgba(255,255,255,0.3); }
  #nameInput:focus {
    border-color: #ff6bff;
    box-shadow: 0 0 0 4px rgba(255,107,255,0.15);
  }

  #playBtn {
    background: linear-gradient(135deg, #ff6bff, #7c3aed);
    border: none;
    border-radius: 50px;
    padding: 15px 50px;
    font-size: 1.2rem;
    font-family: 'Fredoka One', cursive;
    color: #fff;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 24px rgba(255,107,255,0.4);
    text-transform: uppercase;
  }

  #playBtn:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 32px rgba(255,107,255,0.6);
  }

  #playBtn:active { transform: scale(0.97); }

  .start-tip {
    margin-top: 28px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.7;
  }

  /* ===== GAME OVER SCREEN ===== */
  #gameOverScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 12px;
  }

  #gameOverScreen.show { display: flex; }

  #gameOverScreen h2 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    color: #ff4444;
    text-shadow: 0 0 30px #ff444466;
    letter-spacing: 3px;
  }

  #finalScore {
    font-size: 1.3rem;
    color: #a78bfa;
    font-weight: 700;
    letter-spacing: 2px;
  }

  #killedBy {
    font-size: 1rem;
    color: rgba(255,255,255,0.5);
    font-style: italic;
  }

  #restartBtn {
    margin-top: 16px;
    background: linear-gradient(135deg, #ff6bff, #7c3aed);
    border: none;
    border-radius: 50px;
    padding: 14px 44px;
    font-size: 1.1rem;
    font-family: 'Fredoka One', cursive;
    color: #fff;
    cursor: pointer;
    letter-spacing: 2px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(255,107,255,0.4);
    text-transform: uppercase;
  }

  #restartBtn:hover { transform: scale(1.06); box-shadow: 0 8px 28px rgba(255,107,255,0.6); }
  #restartBtn:active { transform: scale(0.97); }

  /* ===== HUD ===== */
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: none;
  }

  #hud.show { display: block; }

  #scoreDisplay {
    position: absolute;
    bottom: 24px;
    left: 24px;
    background: rgba(0,0,0,0.55);
    border: 1.5px solid rgba(255,107,255,0.3);
    border-radius: 14px;
    padding: 10px 20px;
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 1px;
  }

  #scoreDisplay span { color: #ff6bff; font-family: 'Fredoka One', cursive; font-size: 1.3rem; }

  #leaderboard {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(0,0,0,0.6);
    border: 1.5px solid rgba(255,107,255,0.25);
    border-radius: 16px;
    padding: 14px 18px;
    min-width: 180px;
    max-width: 220px;
  }

  #leaderboard h3 {
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem;
    color: #ff6bff;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-align: center;
  }

  .lb-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .lb-row:last-child { border-bottom: none; }
  .lb-rank { color: #a78bfa; width: 16px; font-family: 'Fredoka One', cursive; }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { color: #ff6bff; font-family: 'Fredoka One', cursive; }
  .lb-row.is-player { color: #fff; background: rgba(255,107,255,0.12); border-radius: 8px; padding: 4px 6px; }

  #boostHint {
    position: absolute;
    bottom: 24px;
    right: 24px;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px 16px;
    color: rgba(255,255,255,0.4);
    font-size: 0.78rem;
    letter-spacing: 1px;
  }

  #miniMap {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.7;
  }
</style>
</head>
<body>

<!-- ===== START SCREEN ===== -->
<div id="startScreen">
  <div id="startCat">🐱</div>
  <h1>LONGCAT.IO</h1>
  <p class="subtitle">The longest cat wins</p>
  <input type="text" id="nameInput" placeholder="Enter your name..." maxlength="16" />
  <button id="playBtn">PLAY</button>
  <p class="start-tip">🖱 Move mouse to steer &nbsp;|&nbsp; Left click to boost<br>Hit other cats' bodies to kill them • Don't hit theirs!</p>
</div>

<!-- ===== HUD (in-game) ===== -->
<div id="hud">
  <div id="scoreDisplay">Score: <span id="scoreVal">0</span></div>
  <div id="leaderboard">
    <h3>🏆 Leaderboard</h3>
    <div id="lbContent"></div>
  </div>
  <div id="boostHint">Hold LMB to boost</div>
  <canvas id="miniMap" width="100" height="100"></canvas>
</div>

<!-- ===== GAME OVER ===== -->
<div id="gameOverScreen">
  <h2>GAME OVER</h2>
  <div id="killedBy">You ran into another cat!</div>
  <div id="finalScore">Final Score: 0</div>
  <button id="restartBtn">▶ Play Again</button>
</div>

<!-- ===== GAME CANVAS ===== -->
<canvas id="gameCanvas"></canvas>

<script>
// =====================================================================
// LONGCAT.IO — Single-file HTML5 Canvas Game
// =====================================================================

// ---------- DOM REFS ----------
const canvas      = document.getElementById('gameCanvas');
const ctx         = canvas.getContext('2d');
const miniMapCv   = document.getElementById('miniMap');
const mmCtx       = miniMapCv.getContext('2d');
const startScreen = document.getElementById('startScreen');
const gameOverScr = document.getElementById('gameOverScreen');
const hud         = document.getElementById('hud');
const nameInput   = document.getElementById('nameInput');
const playBtn     = document.getElementById('playBtn');
const restartBtn  = document.getElementById('restartBtn');
const scoreVal    = document.getElementById('scoreVal');
const lbContent   = document.getElementById('lbContent');
const killedByEl  = document.getElementById('killedBy');
const finalScoreEl= document.getElementById('finalScore');

// ---------- WORLD CONSTANTS ----------
const WORLD_W   = 3200;  // world width in pixels
const WORLD_H   = 3200;  // world height in pixels
const CELL_SIZE = 80;    // grid cell size for spatial hashing

// ---------- GAME SPEEDS & TUNING ----------
const BASE_SPEED    = 1.9;   // normal movement speed
const BOOST_SPEED   = 3.5;   // boosted speed
const BOOST_COST    = 2;     // frames between segment removal while boosting
const SEGMENT_GAP   = 10;    // distance between body segments
const SEGMENT_RADIUS= 10;    // half-width of body segment
const HEAD_RADIUS   = 14;    // half-size of cat head
const MIN_LENGTH    = 8;     // minimum segments before you can die from boost
const FOOD_COUNT    = 380;   // total food pellets on map
const BOT_COUNT     = 18;    // number of AI bots
const TURN_SPEED    = 0.10;  // radians per frame for turning

// ---------- FAMOUS SINGER NAMES for bots ----------
const SINGER_NAMES = [
  "Taylor Swift","Eminem","Bruno Mars","Billie Eilish","Kanye West",
  "Drake","Ariana Grande","Justin Bieber","Lady Gaga","Travis Scott",
  "Beyoncé","Rihanna","Post Malone","Doja Cat","The Weeknd",
  "Olivia Rodrigo","Harry Styles","Lizzo","Dua Lipa","Ed Sheeran",
  "Lil Nas X","Cardi B","Shawn Mendes","Nicki Minaj","Adam Levine"
];

// ---------- CAT COLORS (body gradient pairs) ----------
const CAT_PALETTES = [
  { body:'#f97316', head:'#ea580c', name:'Orange' },
  { body:'#ffffff', head:'#e2e8f0', name:'White'  },
  { body:'#6b7280', head:'#4b5563', name:'Grey'   },
  { body:'#1c1917', head:'#292524', name:'Black'  },
  { body:'#fbbf24', head:'#f59e0b', name:'Tabby'  },
  { body:'#a78bfa', head:'#7c3aed', name:'Purple' },
  { body:'#34d399', head:'#059669', name:'Mint'   },
  { body:'#f472b6', head:'#db2777', name:'Pink'   },
  { body:'#60a5fa', head:'#2563eb', name:'Blue'   },
  { body:'#fb923c', head:'#c2410c', name:'Ginger' },
];

// ---------- GLOBAL GAME STATE ----------
let player = null;
let bots   = [];
let foods  = [];
let camera = { x: 0, y: 0 };
let mouseX = canvas.width  / 2;
let mouseY = canvas.height / 2;
let mouseDown  = false;
let gameRunning = false;
let frameCount  = 0;
let deadFoods   = []; // food dropped by dead cats

// Spatial hash grid for efficient collision detection
let grid = {};

// =====================================================================
// CANVAS RESIZE
// =====================================================================
function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// =====================================================================
// UTILITY FUNCTIONS
// =====================================================================
function rand(min, max) { return Math.random() * (max - min) + min; }
function randInt(min, max) { return Math.floor(rand(min, max)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function angleTo(from, to) { return Math.atan2(to.y - from.y, to.x - from.x); }

// Clamp angle to [-PI, PI]
function normalizeAngle(a) {
  while (a >  Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

// Random palette
function randPalette() { return CAT_PALETTES[randInt(0, CAT_PALETTES.length)]; }

// Random singer name (no repeats until pool exhausted)
let singerPool = [...SINGER_NAMES];
function nextSinger() {
  if (singerPool.length === 0) singerPool = [...SINGER_NAMES];
  const idx = randInt(0, singerPool.length);
  return singerPool.splice(idx, 1)[0];
}

// =====================================================================
// SPATIAL HASH — for fast collision detection
// =====================================================================
function gridKey(x, y) {
  return `${Math.floor(x / CELL_SIZE)},${Math.floor(y / CELL_SIZE)}`;
}

function buildGrid(snakes) {
  grid = {};
  for (const snake of snakes) {
    if (!snake.alive) continue;
    // Only index body segments (skip index 0 = head for self-collision check)
    for (let i = 1; i < snake.segments.length; i++) {
      const seg = snake.segments[i];
      const key = gridKey(seg.x, seg.y);
      if (!grid[key]) grid[key] = [];
      grid[key].push({ snake, segIdx: i });
    }
  }
}

function queryGrid(x, y, radius) {
  const results = [];
  const cx = Math.floor(x / CELL_SIZE);
  const cy = Math.floor(y / CELL_SIZE);
  const cells = Math.ceil(radius / CELL_SIZE) + 1;
  for (let dx = -cells; dx <= cells; dx++) {
    for (let dy = -cells; dy <= cells; dy++) {
      const key = `${cx + dx},${cy + dy}`;
      if (grid[key]) results.push(...grid[key]);
    }
  }
  return results;
}

// =====================================================================
// FOOD CLASS
// =====================================================================
class Food {
  constructor(x, y, value = 1, big = false) {
    this.x     = x !== undefined ? x : rand(50, WORLD_W - 50);
    this.y     = y !== undefined ? y : rand(50, WORLD_H - 50);
    this.value = value;
    this.big   = big;
    this.r     = big ? 9 : 5;
    // Vibrant neon color
    const hue  = randInt(0, 360);
    this.color = `hsl(${hue}, 100%, 65%)`;
    this.pulse = rand(0, Math.PI * 2); // animation phase
  }

  update() { this.pulse += 0.08; }

  draw(cx, cy) {
    const sx = this.x - cx;
    const sy = this.y - cy;
    const pr = this.r + Math.sin(this.pulse) * 1.5;

    // Glow
    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, pr * 2.5);
    grad.addColorStop(0, this.color);
    grad.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(sx, sy, pr * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Core dot
    ctx.beginPath();
    ctx.arc(sx, sy, pr, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();

    // Shine
    ctx.beginPath();
    ctx.arc(sx - pr * 0.3, sy - pr * 0.3, pr * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
  }
}

// =====================================================================
// SNAKE (Cat) CLASS — used by both player and bots
// =====================================================================
class Snake {
  constructor(name, palette, isPlayer = false) {
    this.name     = name;
    this.palette  = palette;
    this.isPlayer = isPlayer;
    this.alive    = true;
    this.score    = 0;
    this.angle    = rand(0, Math.PI * 2);
    this.speed    = BASE_SPEED;
    this.boosting = false;
    this.boostTimer = 0;

    // Spawn in a random location
    const sx = rand(200, WORLD_W - 200);
    const sy = rand(200, WORLD_H - 200);

    // Create initial segments
    this.segments = [];
    const initLen = isPlayer ? 24 : randInt(18, 32);
    for (let i = 0; i < initLen; i++) {
      this.segments.push({
        x: sx - Math.cos(this.angle) * i * SEGMENT_GAP,
        y: sy - Math.sin(this.angle) * i * SEGMENT_GAP
      });
    }

    // Bot AI state
    this.targetAngle  = this.angle;
    this.aiTimer      = 0;
    this.aiMode       = 'wander';  // wander | chase | flee
    this.aiTarget     = null;      // food or position target
  }

  get head() { return this.segments[0]; }

  get length() { return this.segments.length; }

  // Turn towards a target angle smoothly
  steerTowards(targetAngle) {
    const diff = normalizeAngle(targetAngle - this.angle);
    const maxTurn = TURN_SPEED;
    this.angle += Math.max(-maxTurn, Math.min(maxTurn, diff));
  }

  // Move the snake forward, push new head, pop last segment
  move() {
    this.speed = (this.boosting && this.length > MIN_LENGTH) ? BOOST_SPEED : BASE_SPEED;

    const newHead = {
      x: this.head.x + Math.cos(this.angle) * this.speed,
      y: this.head.y + Math.sin(this.angle) * this.speed
    };

    // Wrap around world edges
    newHead.x = ((newHead.x % WORLD_W) + WORLD_W) % WORLD_W;
    newHead.y = ((newHead.y % WORLD_H) + WORLD_H) % WORLD_H;

    this.segments.unshift(newHead);

    // Remove tail unless growing
    if (this.growing > 0) {
      this.growing--;
    } else {
      this.segments.pop();
    }

    // Consume tail segment while boosting (snake shrinks)
    if (this.boosting && this.length > MIN_LENGTH) {
      this.boostTimer++;
      if (this.boostTimer >= BOOST_COST) {
        this.boostTimer = 0;
        const tail = this.segments.pop();
        // Drop a small food where the tail was
        if (Math.random() < 0.4) {
          deadFoods.push(new Food(tail.x, tail.y, 1, false));
        }
      }
    }
  }

  grow(amount) {
    this.growing = (this.growing || 0) + amount * 4;
    this.score   += amount;
  }

  // ---- BOT AI ----
  updateAI(allSnakes) {
    this.aiTimer--;
    if (this.aiTimer > 0) return;
    this.aiTimer = randInt(20, 50); // re-evaluate every 20-50 frames

    const head = this.head;

    // Check for nearby danger (other snakes' heads)
    let dangerAngle = null;
    for (const other of allSnakes) {
      if (other === this || !other.alive) continue;
      const d = dist(head, other.head);
      if (d < 120) {
        // Flee away from the other head
        dangerAngle = angleTo(head, other.head) + Math.PI;
        break;
      }
    }

    if (dangerAngle !== null) {
      this.aiMode = 'flee';
      this.targetAngle = dangerAngle;
      this.boosting = Math.random() < 0.5;
      return;
    }

    this.boosting = false;
    this.aiMode = 'wander';

    // Find nearest food
    let bestFood = null;
    let bestDist = Infinity;
    const allFoods = [...foods, ...deadFoods];
    for (const f of allFoods) {
      const d = dist(head, f);
      if (d < bestDist && d < 400) {
        bestDist = d;
        bestFood = f;
      }
    }

    if (bestFood) {
      this.targetAngle = angleTo(head, bestFood);
      this.aiMode = 'chase';
    } else {
      // Random wander with slight drift
      this.targetAngle = this.angle + rand(-0.8, 0.8);
    }

    // Avoid world edges
    const margin = 150;
    if (head.x < margin)           this.targetAngle = 0;
    else if (head.x > WORLD_W - margin) this.targetAngle = Math.PI;
    if (head.y < margin)           this.targetAngle = Math.PI / 2;
    else if (head.y > WORLD_H - margin) this.targetAngle = -Math.PI / 2;
  }

  // ---- DRAW ----
  draw(camX, camY) {
    if (!this.alive) return;

    const { body: bodyColor, head: headColor } = this.palette;

    // --- Draw body segments (back to front) ---
    for (let i = this.segments.length - 1; i >= 1; i--) {
      const seg = this.segments[i];
      const sx = seg.x - camX;
      const sy = seg.y - camY;

      // Skip off-screen segments for performance
      if (sx < -30 || sx > canvas.width + 30 || sy < -30 || sy > canvas.height + 30) continue;

      // Size tapers toward tail
      const t   = 1 - i / this.segments.length;
      const r   = SEGMENT_RADIUS * (0.4 + t * 0.7);

      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fillStyle = bodyColor;
      ctx.fill();

      // Stripe pattern every 4 segments
      if (i % 4 === 0) {
        ctx.beginPath();
        ctx.arc(sx, sy, r * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = headColor;
        ctx.fill();
      }
    }

    // --- Draw cat head ---
    this.drawCatHead(camX, camY, headColor, bodyColor);
  }

  drawCatHead(camX, camY, headColor, bodyColor) {
    const hd = this.head;
    const sx = hd.x - camX;
    const sy = hd.y - camY;

    // Skip if off screen
    if (sx < -60 || sx > canvas.width + 60 || sy < -60 || sy > canvas.height + 60) return;

    const R = HEAD_RADIUS;

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(this.angle);

    // Head circle
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fillStyle = headColor;
    ctx.fill();

    // Ears (triangles)
    ctx.fillStyle = headColor;
    // Left ear
    ctx.beginPath();
    ctx.moveTo(-R * 0.5, -R * 0.7);
    ctx.lineTo(-R * 0.1, -R * 1.4);
    ctx.lineTo(R * 0.2, -R * 0.6);
    ctx.closePath();
    ctx.fill();
    // Right ear
    ctx.beginPath();
    ctx.moveTo(R * 0.5, -R * 0.7);
    ctx.lineTo(R * 0.1, -R * 1.4);
    ctx.lineTo(-R * 0.2, -R * 0.6);
    ctx.closePath();
    ctx.fill();

    // Inner ear
    ctx.fillStyle = 'rgba(255,150,150,0.5)';
    ctx.beginPath();
    ctx.moveTo(-R * 0.4, -R * 0.75);
    ctx.lineTo(-R * 0.1, -R * 1.2);
    ctx.lineTo(R * 0.1, -R * 0.7);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(R * 0.4, -R * 0.75);
    ctx.lineTo(R * 0.1, -R * 1.2);
    ctx.lineTo(-R * 0.1, -R * 0.7);
    ctx.closePath();
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-R * 0.35, -R * 0.1, R * 0.28, R * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(R * 0.35, -R * 0.1, R * 0.28, R * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    // Pupils
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.ellipse(-R * 0.35, -R * 0.1, R * 0.12, R * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(R * 0.35, -R * 0.1, R * 0.12, R * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eye shine
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(-R * 0.3, -R * 0.18, R * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(R * 0.4,  -R * 0.18, R * 0.07, 0, Math.PI * 2); ctx.fill();

    // Nose
    ctx.fillStyle = '#ffb6c1';
    ctx.beginPath();
    ctx.moveTo(0, R * 0.15);
    ctx.lineTo(-R * 0.12, R * 0.3);
    ctx.lineTo(R * 0.12, R * 0.3);
    ctx.closePath();
    ctx.fill();

    // Mouth
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, R * 0.32);
    ctx.lineTo(-R * 0.2, R * 0.5);
    ctx.moveTo(0, R * 0.32);
    ctx.lineTo(R * 0.2, R * 0.5);
    ctx.stroke();

    // Whiskers
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.8;
    // Left whiskers
    for (const angle of [-0.2, 0, 0.2]) {
      ctx.save();
      ctx.translate(-R * 0.2, R * 0.25);
      ctx.rotate(Math.PI + angle);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R * 0.9, 0);
      ctx.stroke();
      ctx.restore();
    }
    // Right whiskers
    for (const angle of [-0.2, 0, 0.2]) {
      ctx.save();
      ctx.translate(R * 0.2, R * 0.25);
      ctx.rotate(angle);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R * 0.9, 0);
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();

    // --- Name label above head ---
    const labelY = sy - HEAD_RADIUS - (this.isPlayer ? 28 : 22);
    const fontSize = this.isPlayer ? 13 : 11;
    ctx.font = `bold ${fontSize}px Nunito, sans-serif`;
    ctx.textAlign = 'center';

    // Background pill
    const tw = ctx.measureText(this.name).width;
    const pad = 5;
    const pillW = tw + pad * 2;
    const pillH = fontSize + 4;
    const pillX = sx - pillW / 2;
    const pillYY = labelY - fontSize;

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.beginPath();
    ctx.roundRect(pillX, pillYY, pillW, pillH, 5);
    ctx.fill();

    ctx.fillStyle = this.isPlayer ? '#ff6bff' : '#ffffff';
    ctx.fillText(this.name, sx, labelY);
  }
}

// =====================================================================
// FOOD INITIALIZATION
// =====================================================================
function initFoods() {
  foods = [];
  deadFoods = [];
  for (let i = 0; i < FOOD_COUNT; i++) {
    foods.push(new Food());
  }
}

// Respawn food to maintain count
function maintainFoods() {
  while (foods.length + deadFoods.length < FOOD_COUNT) {
    foods.push(new Food());
  }
}

// =====================================================================
// KILL CAT — turn snake into big food pellets
// =====================================================================
function killSnake(snake, killerName) {
  if (!snake.alive) return;
  snake.alive = false;

  // Drop food every N segments
  for (let i = 0; i < snake.segments.length; i += 3) {
    const seg = snake.segments[i];
    const isBig = i % 9 === 0;
    deadFoods.push(new Food(
      seg.x + rand(-8, 8),
      seg.y + rand(-8, 8),
      isBig ? 3 : 1,
      isBig
    ));
  }

  if (snake.isPlayer) {
    killedByEl.textContent = killerName
      ? `You were killed by ${killerName}!`
      : `You hit a wall or your own tail!`;
    finalScoreEl.textContent = `Final Score: ${snake.score}`;
    gameOverScr.classList.add('show');
    hud.classList.remove('show');
    gameRunning = false;
  }
}

// =====================================================================
// COLLISION DETECTION
// =====================================================================
function checkCollisions(allSnakes) {
  // Rebuild spatial grid each frame
  buildGrid(allSnakes);

  for (const snake of allSnakes) {
    if (!snake.alive) continue;

    const head = snake.head;

    // Check head vs food (both regular and dead-drops)
    for (const foodList of [foods, deadFoods]) {
      for (let i = foodList.length - 1; i >= 0; i--) {
        const f = foodList[i];
        if (dist(head, f) < HEAD_RADIUS + f.r) {
          snake.grow(f.value);
          foodList.splice(i, 1);
        }
      }
    }

    // Check head vs other snakes' body segments (via grid)
    const nearby = queryGrid(head.x, head.y, HEAD_RADIUS + SEGMENT_RADIUS + 5);
    for (const entry of nearby) {
      if (entry.snake === snake) continue; // skip self
      if (!entry.snake.alive) continue;
      const seg = entry.snake.segments[entry.segIdx];
      if (dist(head, seg) < HEAD_RADIUS + SEGMENT_RADIUS) {
        // This snake's head hit another snake's body -> die
        killSnake(snake, entry.snake.name);
        break;
      }
    }
  }
}

// =====================================================================
// CAMERA
// =====================================================================
function updateCamera() {
  if (!player || !player.alive) return;
  camera.x = player.head.x - canvas.width  / 2;
  camera.y = player.head.y - canvas.height / 2;
}

// =====================================================================
// LEADERBOARD
// =====================================================================
function updateLeaderboard(allSnakes) {
  const sorted = [...allSnakes].filter(s => s.alive).sort((a, b) => b.score - a.score).slice(0, 8);

  lbContent.innerHTML = '';
  sorted.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row' + (s.isPlayer ? ' is-player' : '');
    row.innerHTML = `<span class="lb-rank">${i + 1}</span>
                     <span class="lb-name">${s.name}</span>
                     <span class="lb-score">${s.score}</span>`;
    lbContent.appendChild(row);
  });
}

// =====================================================================
// MINI MAP
// =====================================================================
function drawMiniMap(allSnakes) {
  const W = miniMapCv.width;
  const H = miniMapCv.height;
  const scaleX = W / WORLD_W;
  const scaleY = H / WORLD_H;

  mmCtx.clearRect(0, 0, W, H);

  // Background
  mmCtx.fillStyle = 'rgba(0,0,0,0.55)';
  mmCtx.beginPath();
  mmCtx.roundRect(0, 0, W, H, 8);
  mmCtx.fill();

  // Border
  mmCtx.strokeStyle = 'rgba(255,107,255,0.3)';
  mmCtx.lineWidth = 1;
  mmCtx.beginPath();
  mmCtx.roundRect(0, 0, W, H, 8);
  mmCtx.stroke();

  // Snakes
  for (const s of allSnakes) {
    if (!s.alive) continue;
    const hd = s.head;
    const mx = hd.x * scaleX;
    const my = hd.y * scaleY;
    mmCtx.beginPath();
    mmCtx.arc(mx, my, s.isPlayer ? 4 : 2.5, 0, Math.PI * 2);
    mmCtx.fillStyle = s.isPlayer ? '#ff6bff' : s.palette.body;
    mmCtx.fill();
  }

  // Camera viewport rectangle
  const vx = camera.x * scaleX;
  const vy = camera.y * scaleY;
  const vw = canvas.width  * scaleX;
  const vh = canvas.height * scaleY;
  mmCtx.strokeStyle = 'rgba(255,255,255,0.25)';
  mmCtx.lineWidth = 1;
  mmCtx.strokeRect(vx, vy, vw, vh);
}

// =====================================================================
// BACKGROUND GRID DRAW
// =====================================================================
function drawBackground() {
  // Deep space background
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;

  const gridSize = 80;
  const offsetX  = (-camera.x) % gridSize;
  const offsetY  = (-camera.y) % gridSize;

  for (let x = offsetX; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = offsetY; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // World border
  const bx = -camera.x;
  const by = -camera.y;
  ctx.strokeStyle = 'rgba(255,107,255,0.3)';
  ctx.lineWidth = 3;
  ctx.strokeRect(bx, by, WORLD_W, WORLD_H);

  // Vignette
  const vgrad = ctx.createRadialGradient(
    canvas.width/2, canvas.height/2, canvas.width * 0.2,
    canvas.width/2, canvas.height/2, canvas.width * 0.75
  );
  vgrad.addColorStop(0, 'transparent');
  vgrad.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vgrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// =====================================================================
// MAIN GAME LOOP
// =====================================================================
function gameLoop() {
  if (!gameRunning) return;
  requestAnimationFrame(gameLoop);
  frameCount++;

  const allSnakes = [player, ...bots];

  // --- Update player direction ---
  if (player.alive) {
    const worldMouseX = mouseX + camera.x;
    const worldMouseY = mouseY + camera.y;
    const targetAngle = angleTo(player.head, { x: worldMouseX, y: worldMouseY });
    player.steerTowards(targetAngle);
    player.boosting = mouseDown && player.length > MIN_LENGTH;
    player.move();
    player.growing = player.growing || 0;
  }

  // --- Update bots ---
  for (const bot of bots) {
    if (!bot.alive) {
      // Respawn dead bot after a delay
      if (!bot.respawnTimer) bot.respawnTimer = 180;
      bot.respawnTimer--;
      if (bot.respawnTimer <= 0) {
        const idx = bots.indexOf(bot);
        bots[idx] = new Snake(nextSinger(), randPalette(), false);
        bots[idx].growing = 0;
      }
      continue;
    }
    bot.growing = bot.growing || 0;
    bot.updateAI(allSnakes);
    bot.steerTowards(bot.targetAngle);
    bot.move();
  }

  // --- Update food animations ---
  for (const f of foods)     f.update();
  for (const f of deadFoods) f.update();

  // --- Collisions ---
  checkCollisions(allSnakes);

  // --- Maintain food density ---
  if (frameCount % 30 === 0) maintainFoods();

  // --- Camera ---
  updateCamera();

  // --- DRAW ---
  drawBackground();

  // Draw food (only visible ones)
  const vMargin = 60;
  for (const f of [...foods, ...deadFoods]) {
    const fx = f.x - camera.x;
    const fy = f.y - camera.y;
    if (fx > -vMargin && fx < canvas.width + vMargin &&
        fy > -vMargin && fy < canvas.height + vMargin) {
      f.draw(camera.x, camera.y);
    }
  }

  // Draw bots (furthest from player first, for overlap)
  const sorted = [...bots, player].filter(s => s && s.alive).sort((a, b) => {
    return dist(b.head, player.head) - dist(a.head, player.head);
  });
  for (const s of sorted) s.draw(camera.x, camera.y);

  // Boost trail effect on player
  if (player.alive && player.boosting) {
    const hd = player.head;
    const tx = hd.x - camera.x;
    const ty = hd.y - camera.y;
    for (let p = 0; p < 3; p++) {
      ctx.beginPath();
      ctx.arc(
        tx - Math.cos(player.angle) * (20 + p * 10) + rand(-4, 4),
        ty - Math.sin(player.angle) * (20 + p * 10) + rand(-4, 4),
        rand(3, 6), 0, Math.PI * 2
      );
      ctx.fillStyle = `rgba(255,107,255,${0.5 - p * 0.15})`;
      ctx.fill();
    }
  }

  // --- HUD ---
  scoreVal.textContent = player.alive ? player.score : 0;
  updateLeaderboard(allSnakes);
  drawMiniMap(allSnakes.filter(s => s && s.alive));
}

// =====================================================================
// START GAME
// =====================================================================
function startGame(playerName) {
  // Reset state
  frameCount  = 0;
  deadFoods   = [];
  grid        = {};
  singerPool  = [...SINGER_NAMES];

  // Create player
  player = new Snake(playerName || 'You', randPalette(), true);
  player.growing = 0;

  // Create bots
  bots = [];
  for (let i = 0; i < BOT_COUNT; i++) {
    const bot = new Snake(nextSinger(), randPalette(), false);
    bot.growing = 0;
    bots.push(bot);
  }

  // Init food
  initFoods();

  // Show HUD, hide screens
  startScreen.style.display = 'none';
  gameOverScr.classList.remove('show');
  hud.classList.add('show');

  gameRunning = true;
  gameLoop();
}

// =====================================================================
// INPUT EVENTS
// =====================================================================
canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0) mouseDown = true;
});

canvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouseDown = false;
});

// Prevent right-click menu on canvas
canvas.addEventListener('contextmenu', e => e.preventDefault());

// =====================================================================
// UI BUTTON EVENTS
// =====================================================================
playBtn.addEventListener('click', () => {
  const name = nameInput.value.trim() || 'Anon';
  startGame(name);
});

nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') playBtn.click();
});

restartBtn.addEventListener('click', () => {
  const name = nameInput.value.trim() || 'Anon';
  startGame(name);
});

// =====================================================================
// POLYFILL: roundRect for older browsers
// =====================================================================
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y,     x + w, y + h, r);
    this.arcTo(x + w, y + h, x,     y + h, r);
    this.arcTo(x,     y + h, x,     y,     r);
    this.arcTo(x,     y,     x + w, y,     r);
    this.closePath();
    return this;
  };
}
